  #   source: sterile
  #   description: Convert Unicode [and accented ASCII] characters to their plain-text ASCII equivalents.
  #   group: string-recode
  #   examples:
  #     - input: '{{ "šţɽĩɳģ" | transliterate }}'
  #       output: string

  # - key: smart_format
